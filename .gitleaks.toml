# ──────────────────────────────────────────────────────────────────────────────
# Gitleaks config — stillpoint-website (PUBLIC repo)
#
# Deliberately NOT the shared github-rep house config. This repository is public,
# so it carries only the upstream default ruleset plus allowlists that this repo
# actually needs. Rules and allowlists for unrelated private projects do not
# belong in a public tree.
#
# If the house config is updated, do not blanket-copy it here — port only what a
# static site needs.
# ──────────────────────────────────────────────────────────────────────────────

title = "stillpoint-website gitleaks config"

# Maintained upstream default rules — wide coverage, no local weakening.
[extend]
useDefault = true

[allowlist]
description = "Placeholders and public-by-design values"

regexes = [
  # Common documentation placeholders.
  '''YOUR_[A-Z0-9_]+''',
  '''<[A-Za-z0-9_\- .]*?(?:REDACTED|PASSWORD|SECRET|KEY|TOKEN|your[_-]?[a-z]*)[A-Za-z0-9_\- .]*?>''',
  '''\$\{[A-Z0-9_]+\}''',
  '''(?:xxx+|XXX+|changeme|CHANGEME|placeholder|PLACEHOLDER|example|EXAMPLE)''',
]

paths = [
  '''(^|/)\.git/''',
  '''\.(png|jpe?g|gif|webp|ico|pdf|ttf|woff2?)$''',
]
